# Compila y publica la web en GitHub Pages en cada push a main.
#
# La URL publica sale de la variable del repositorio PUBLIC_SITE_URL
# (Settings > Secrets and variables > Actions > Variables). Sin ella se usa la
# de GitHub Pages. Con dominio propio basta con cambiarla a https://leyanimal.es.
name: Despliegue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: pnpm (version de package.json)
        run: corepack enable

      - name: Dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato, contenido legal, lint, tipos y tests
        run: pnpm verificar

      - name: Compilar
        run: pnpm build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://ivangarmar22.github.io/LeyAnimal' }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
